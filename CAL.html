<label>น้ำหนัก (kg):</label>
<input type="number" id="weight">
<button onclick="calc()">คำนวณ</button>
<p id="result"></p>

<script>
  function calc() {
    let w = document.getElementById("weight").value;
    let dose = w * 10; // ตัวอย่าง 10 mg/kg
    document.getElementById("result").innerText = "ขนาดยา: " + dose + " mg";
  }
</script>
